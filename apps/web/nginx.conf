server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This is the magic line:
        # 1. Try to find the specific file ($uri)
        # 2. Try to find a folder ($uri/)
        # 3. If neither exists, serve index.html (Vue Router takes over)
        try_files $uri $uri/ /index.html;
    }
}